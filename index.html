<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 生產異常戰情室</title>
  </head>
  <body>
    <header id="topbar">
      <span id="brand">AI 生產異常戰情室</span>
      <span id="event-badge"></span>
      <label id="scenario-picker">
        情境:
        <select id="scenario-select" aria-label="切換展示情境"></select>
      </label>
      <nav id="nav"></nav>
      <div id="replay-controls">
        <button id="btn-play" type="button">▶ 90 秒導覽</button>
        <button id="btn-reset" type="button">重設</button>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer id="statusbar">模擬資料|離線事件回放|不含即時控制</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
